# ===========================================================================
# Nginx - Security Headers & Secure Cookie Configuration
#
# This configuration can be placed in:
#   - nginx.conf (main configuration)
#   - /etc/nginx/conf.d/security-headers.conf (included snippet)
#   - Individual server {} blocks
#
# Include this file in your server block:
#   include /etc/nginx/conf.d/security-headers.conf;
# ===========================================================================

# ---------------------------------------------------------------------------
# 1. Force HTTPS Redirect (place in a separate server block)
# ---------------------------------------------------------------------------
# server {
#     listen 80;
#     listen [::]:80;
#     server_name example.com www.example.com;
#     return 301 https://$server_name$request_uri;
# }

# ---------------------------------------------------------------------------
# 2. Main HTTPS Server Block
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # SSL Certificate paths (update with your actual paths)
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # -------------------------------------------------------------------
    # 3. SSL/TLS Configuration
    # -------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------
    # 4. Security Headers
    # -------------------------------------------------------------------

    # Strict-Transport-Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content-Security-Policy (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # X-Content-Type-Options
    add_header X-Content-Type-Options "nosniff" always;

    # X-Frame-Options
    add_header X-Frame-Options "DENY" always;

    # Referrer-Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # X-XSS-Protection (legacy)
    add_header X-XSS-Protection "1; mode=block" always;

    # Cross-Origin-Opener-Policy (COOP)
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Cross-Origin-Resource-Policy (CORP)
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Cross-Origin-Embedder-Policy (COEP)
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Cache-Control for dynamic content
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # -------------------------------------------------------------------
    # 5. Remove Information Leakage Headers
    # -------------------------------------------------------------------

    # Hide Nginx version
    server_tokens off;

    # Remove upstream proxy headers (if using proxy_pass)
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-AspNet-Version;
    proxy_hide_header X-AspNetMvc-Version;
    proxy_hide_header Server;

    # -------------------------------------------------------------------
    # 6. Secure Cookie Configuration
    # -------------------------------------------------------------------

    # Modify cookies from upstream/proxy to add security flags
    # Use proxy_cookie_flags (Nginx 1.19.3+)
    # proxy_cookie_flags ~ secure httponly samesite=strict;

    # Alternative: Use proxy_cookie_path to rewrite cookie attributes
    # proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";

    # For Nginx acting as reverse proxy:
    # location /api/ {
    #     proxy_pass http://backend;
    #     proxy_cookie_flags ~ secure httponly samesite=strict;
    # }

    # -------------------------------------------------------------------
    # 7. Static Asset Caching (override no-cache for static files)
    # -------------------------------------------------------------------
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Re-add security headers (add_header in location blocks
        # overrides parent block headers in Nginx)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # -------------------------------------------------------------------
    # 8. Block Access to Sensitive Files
    # -------------------------------------------------------------------

    # Block hidden files (.env, .git, .htaccess, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block sensitive file extensions
    location ~* \.(env|ini|log|conf|sql|bak|swp|old|orig)$ {
        deny all;
        return 404;
    }

    # -------------------------------------------------------------------
    # 9. Request Size and Rate Limiting
    # -------------------------------------------------------------------

    # Limit request body size (prevents large upload attacks)
    client_max_body_size 10m;

    # Limit buffer sizes
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # -------------------------------------------------------------------
    # 10. Application Location Block
    # -------------------------------------------------------------------
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

# ---------------------------------------------------------------------------
# 11. Rate Limiting Zone (place in http {} block of nginx.conf)
# ---------------------------------------------------------------------------
# http {
#     # Define rate limit zone: 10 requests per second per IP
#     limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
#
#     # Apply in server or location block:
#     # limit_req zone=api_limit burst=20 nodelay;
#     # limit_req_status 429;
# }
