# ===========================================================================
# Apache HTTP Server - Security Headers & Secure Cookie Configuration
#
# This configuration can be placed in:
#   - httpd.conf (global server configuration)
#   - .htaccess (per-directory, if AllowOverride is enabled)
#   - Virtual host configuration block
#
# Required modules:
#   - mod_headers  (a]2enmod headers)
#   - mod_rewrite  (a2enmod rewrite)
#   - mod_ssl      (a2enmod ssl)
# ===========================================================================

# ---------------------------------------------------------------------------
# 1. Enable Required Modules (uncomment in httpd.conf if needed)
# ---------------------------------------------------------------------------
# LoadModule headers_module modules/mod_headers.so
# LoadModule rewrite_module modules/mod_rewrite.so
# LoadModule ssl_module modules/mod_ssl.so

# ---------------------------------------------------------------------------
# 2. Force HTTPS Redirect
# ---------------------------------------------------------------------------
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</IfModule>

# ---------------------------------------------------------------------------
# 3. Security Headers
# ---------------------------------------------------------------------------
<IfModule mod_headers.c>

    # Strict-Transport-Security (HSTS)
    # Forces HTTPS for 1 year, includes subdomains, enables preload
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # Content-Security-Policy (CSP)
    # Restricts resource loading to same origin by default
    Header always set Content-Security-Policy "\
default-src 'self'; \
script-src 'self'; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data: https:; \
font-src 'self'; \
connect-src 'self'; \
media-src 'self'; \
object-src 'none'; \
frame-src 'none'; \
frame-ancestors 'none'; \
base-uri 'self'; \
form-action 'self'; \
upgrade-insecure-requests"

    # X-Content-Type-Options
    # Prevents MIME type sniffing
    Header always set X-Content-Type-Options "nosniff"

    # X-Frame-Options
    # Prevents clickjacking by denying framing
    Header always set X-Frame-Options "DENY"

    # Referrer-Policy
    # Controls how much referrer information is sent
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Permissions-Policy
    # Restricts browser feature access
    Header always set Permissions-Policy "\
accelerometer=(), \
camera=(), \
geolocation=(), \
gyroscope=(), \
magnetometer=(), \
microphone=(), \
payment=(), \
usb=()"

    # X-XSS-Protection (legacy, for older browsers)
    Header always set X-XSS-Protection "1; mode=block"

    # Cross-Origin-Opener-Policy (COOP)
    Header always set Cross-Origin-Opener-Policy "same-origin"

    # Cross-Origin-Resource-Policy (CORP)
    Header always set Cross-Origin-Resource-Policy "same-origin"

    # Cross-Origin-Embedder-Policy (COEP)
    Header always set Cross-Origin-Embedder-Policy "require-corp"

    # Cache-Control for HTML pages
    <FilesMatch "\.(html|htm)$">
        Header set Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </FilesMatch>

    # Allow caching for static assets
    <FilesMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    # ---------------------------------------------------------------------------
    # 4. Remove Information Leakage Headers
    # ---------------------------------------------------------------------------

    # Remove Server version details (partial - see ServerTokens below)
    Header unset Server
    Header always unset X-Powered-By
    Header always unset X-AspNet-Version
    Header always unset X-AspNetMvc-Version

</IfModule>

# Minimize server information in response
ServerTokens Prod
ServerSignature Off

# Disable HTTP TRACE method (prevents Cross-Site Tracing)
TraceEnable Off

# ---------------------------------------------------------------------------
# 5. Secure Cookie Configuration
# ---------------------------------------------------------------------------
<IfModule mod_headers.c>

    # Enforce Secure and HttpOnly flags on ALL Set-Cookie headers
    # This modifies cookies set by the application to add security flags
    Header always edit Set-Cookie ^(.*)$ "$1; Secure; HttpOnly; SameSite=Strict"

    # Alternative: Only add flags if they are not already present
    # Header always edit Set-Cookie "^((?!.*Secure).*)$" "$1; Secure"
    # Header always edit Set-Cookie "^((?!.*HttpOnly).*)$" "$1; HttpOnly"
    # Header always edit Set-Cookie "^((?!.*SameSite).*)$" "$1; SameSite=Strict"

</IfModule>

# ---------------------------------------------------------------------------
# 6. SSL/TLS Configuration (if managing SSL at Apache level)
# ---------------------------------------------------------------------------
<IfModule mod_ssl.c>
    # Use only TLS 1.2 and 1.3
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # Strong cipher suite
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384

    # Prefer server cipher order
    SSLHonorCipherOrder on

    # Disable SSL compression (prevents CRIME attack)
    SSLCompression off

    # Enable OCSP Stapling
    SSLUseStapling on
    SSLStaplingCache "shmcb:logs/ssl_stapling(128000)"
</IfModule>

# ---------------------------------------------------------------------------
# 7. Directory Security
# ---------------------------------------------------------------------------

# Prevent access to hidden files (.htaccess, .git, .env, etc.)
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Prevent access to sensitive file types
<FilesMatch "\.(env|ini|log|conf|sql|bak|swp)$">
    Require all denied
</FilesMatch>

# Disable directory listing
Options -Indexes

# Prevent script execution in upload directories
<Directory "/var/www/html/uploads">
    Options -ExecCGI
    RemoveHandler .php .phtml .php3 .php4 .php5
    <FilesMatch "\.ph(p[345]?|tml)$">
        Require all denied
    </FilesMatch>
</Directory>
